<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Of Playing Cards</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main id='playing-cards'>
    <div class='card'>
      <div class='left'>A</div>
      <div class='middle'>
        <div class='left-side'>♠</div>
        <div class='middle-side'>♠</div>
        <div class='right-side'>♠</div>
      </div>
      <div class='right'>A</div>
    </div>

    <div class='card'>
      <div class='left'>A</div>
      <div class='middle'>
        <div class='left-side'>♣</div>
        <div class='middle-side'>♣</div>
        <div class='right-side'>♣</div>
      </div>
      <div class='right'>A</div>
    </div>

    <div class='card'>
      <div class='left'>A</div>
      <div class='middle'>
        <div class='left-side heart'>♥</div>
        <div class='middle-side'>
          <div class="top-heart heart">♥</div>
          <div class="bottom-heart heart">♥</div>
        </div>
        <div class='right-side heart'>♥</div>
      </div>
      <div class='right'>A</div>
    </div>
  </main>
</body>
</html>
