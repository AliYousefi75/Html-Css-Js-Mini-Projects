<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>TO DO LIST</h1>
        <input class="search" type="search" placeholder="search ...">
        <h2>your list</h2>
        <main>
            <div class="data">
                <p>clean up your room</p>
                <button class="delete">delete</button>
            </div>
            <div class="data">
                <p>find a motivational book for reading</p>
                <button class="delete">delete</button>
            </div>
            <div class="data">
                <p>go to the gym</p>
                <button class="delete">delete</button>
            </div>
            <div class="data">
                <p>set your goals</p>
                <button class="delete">delete</button>
            </div>
        </main>
        <div class="bottom">
            <input class="add" type="text">
            <button id="add-btn">add</button>
        </div>
    </div>


    <script src="./script.js"></script>
</body>
</html>
