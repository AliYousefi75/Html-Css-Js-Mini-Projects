<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class='container'>
        <h1>Job Application Form</h1>
        <form>
            <label class="labels" for='name'>Full Name:</label>
            <input class="detail" id='name' type='text' placeholder="Enter your name"/>
            <label class="labels" for='email'>
                Email:</label>
            <input class="detail" id='email' type='email' placeholder="Enter your email"/>

            <label class="labels" for='position'>Position:</label>
            <select class="detail" id='position'>
                <option value="">Select a position</option>
                <option>Developer</option>
                <option>Designer</option>
                <option>Manager</option>
            </select>

            <!-- <fieldset class='radio-group'>
                <legend>Availability</legend>
                <input id='full-time' type='radio' name='availability'/>
                <label for='full-time'>Full-Time</label>
                <input id='part-time' type='radio' name='availability'/>
                <label for='part-time'>Part-Time</label>
            </fieldset> -->

            <fieldset class="radio-group">
              <legend>Availability:</legend>
                <input type="radio" id="fullTime" name="availability" value="fullTime" checked="">
                <label for="fullTime">Full-Time</label>
                <input type="radio" id="partTime" name="availability" value="partTime">
                <label for="partTime">Part-Time</label>
            </fieldset>



            <label class="labels" for="message">Why do you want this job?</label>
            <textarea id="message" name="message" rows="5" placeholder="write your motivtion"></textarea>
            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
